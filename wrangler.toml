# Gestor de tráfego do ATENDIMENTO PRONTO (ramo atendimento-pronto). A ExtraIA fica no ramo main, com o Worker
# gestor-extraia. Mesmo código, Worker, banco, bucket e segredos separados: não misturar os projetos.
# Valores <...> são preenchidos na criação (ids que a Cloudflare/Meta devolvem).
name = "gestor-atendimento"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# 03:00 de Brasília (06:00 UTC): coleta + regras + time. Nas outras horas, só o Vigia.
[triggers]
crons = ["0 6 * * *", "20 * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gestor-atendimento"
database_id = "<id do banco gestor-atendimento>"
migrations_dir = "migrations"

# Criativos: navegador para renderizar HTML → PNG e bucket para guardar as imagens.
[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "CRIATIVOS"
bucket_name = "gestor-atendimento-criativos"

# Os 3 criativos do teste pago aprovados pelo Vitor (publico/teste/). O Worker lê daqui para subir na Meta.
# run_worker_first: os arquivos não ficam abertos no endereço do Worker; só o código lê, pelo ASSETS.
[assets]
directory = "./publico"
binding = "ASSETS"
run_worker_first = true

# Opcional: e-mail de alertas/relatórios/login (Cloudflare Email Service, com um domínio ativado).
# Sem isto, alertas e relatório ficam no painel e o código de login sai no log do Worker.
# [[send_email]]
# name = "EMAIL"

[observability]
enabled = true

[vars]
# Endereço público do Worker.
APP_URL = "https://gestor-atendimento.vtdopix29.workers.dev"
# Meta: preenchidos quando a conta de anúncios "Atendimento Pronto" e a página existirem.
META_AD_ACCOUNT_ID = ""
META_PAGE_ID = ""
# Perfil do Instagram dos anúncios (@atendimento.pronto). Vazio = o Worker pergunta à Meta qual perfil está ligado à página.
META_IG_USER_ID = ""
META_ADSET_CRIADOR_ID = ""
META_CAPI_ATIVO = "false"
META_DATASET_ID = ""
META_TEST_EVENT_CODE = ""
# Destino dos anúncios e página lida pelo Criador: o site do Atendimento Pronto.
CRIADOR_LINK = "https://atendimentopronto.netlify.app/"
CRIADOR_PAGINAS = "https://atendimentopronto.netlify.app/"
# Modelos pela OpenRouter e teto de custo por dia em dólar (conservador).
LLM_MODELO_ANALISTA = "anthropic/claude-sonnet-5.5"
LLM_MODELO_ANALISTA_RESERVA = "deepseek/deepseek-v4-pro"
LLM_MODELO_CRIADOR = "anthropic/claude-sonnet-5.5"
LLM_MODELO_VERIFICADOR = "anthropic/claude-haiku-5.5"
LLM_TETO_USD_DIA = "0.5"
# Quem recebe alertas e o relatório semanal (vírgula) e o remetente, quando o e-mail estiver ligado.
ALERTA_EMAILS = ""
EMAIL_REMETENTE = "alertas@<seu-dominio>"

# Segredos (definidos no painel da Cloudflare, nunca no chat):
#   ADMIN_TOKEN         senha das rotas /admin (invente uma longa)
#   LOGIN_SEGREDO       outra senha longa: assina os códigos e as sessões do login por e-mail
#   OPENROUTER_API_KEY  chave da OpenRouter só deste Worker (os modelos de IA rodam por ela)
#   META_ADS_TOKEN      token de usuário do sistema com ads_read e ads_management na conta "Atendimento Pronto"
