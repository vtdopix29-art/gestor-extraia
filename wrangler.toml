# Gestor de tráfego da ExtraIA. Valores <...> são preenchidos no deploy (ids que a Cloudflare/Meta devolvem).
name = "gestor-extraia"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

# 03:00 de Brasília (06:00 UTC): coleta + regras + time. Nas outras horas, só o Vigia.
[triggers]
crons = ["0 6 * * *", "20 * * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "gestor-extraia"
database_id = "<id devolvido ao criar o banco D1 gestor-extraia>"
migrations_dir = "migrations"

# Criativos: navegador para renderizar HTML → PNG e bucket para guardar as imagens.
[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "CRIATIVOS"
bucket_name = "gestor-extraia-criativos"

# Opcional: e-mail de alertas/relatórios/login (Cloudflare Email Service, com um domínio ativado).
# Sem isto, alertas e relatório ficam no painel e o código de login sai no log do Worker.
# [[send_email]]
# name = "EMAIL"

[observability]
enabled = true

[vars]
# Endereço público do Worker (o wrangler/Cloudflare imprime o endereço workers.dev no 1º deploy).
APP_URL = "https://gestor-extraia.<sua-conta>.workers.dev"
# Meta: preenchidos na fase do Meta (mais pra frente). Até lá ficam vazios e o time roda em sombra lendo o histórico.
META_AD_ACCOUNT_ID = "<id da conta de anúncios>"
META_PAGE_ID = "<id da página do Facebook>"
META_ADSET_CRIADOR_ID = "<id do conjunto de anúncios de teste>"
META_CAPI_ATIVO = "false"
META_DATASET_ID = ""
META_TEST_EVENT_CODE = ""
# Destino dos anúncios e página lida pelo Criador: o quiz da ExtraIA.
CRIADOR_LINK = "https://extraia-app.netlify.app/quiz/"
CRIADOR_PAGINAS = "https://extraia-app.netlify.app/quiz/,https://extraia-app.netlify.app/"
# Modelos pela OpenRouter e teto de custo por dia em dólar (conservador).
LLM_MODELO_ANALISTA = "anthropic/claude-sonnet-5.5"
LLM_MODELO_ANALISTA_RESERVA = "deepseek/deepseek-v4-pro"
LLM_MODELO_CRIADOR = "anthropic/claude-sonnet-5.5"
LLM_MODELO_VERIFICADOR = "anthropic/claude-haiku-5.5"
LLM_TETO_USD_DIA = "1"
# Quem recebe alertas e o relatório semanal (vírgula) e o remetente, quando o e-mail estiver ligado.
ALERTA_EMAILS = ""
EMAIL_REMETENTE = "alertas@<seu-dominio>"

# Segredos (definidos no painel da Cloudflare, nunca no chat):
#   ADMIN_TOKEN         senha das rotas /admin e do /painel (invente uma longa)
#   LOGIN_SEGREDO       outra senha longa: assina os códigos e as sessões do login por e-mail
#   OPENROUTER_API_KEY  chave da OpenRouter (os modelos de IA rodam por ela)
#   WEBHOOK_TOKEN       (fase do pagamento) senha do webhook; na ExtraIA entra por CSV do Impact
#   META_ADS_TOKEN      (fase do Meta) token de usuário do sistema com ads_read e ads_management
